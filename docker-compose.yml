services:
  datascience:
    build: .
    container_name: datascience-streamlit
    ports:
      - "8501:8501"  # Streamlit default port
      - "8888:8888"  # Jupyter notebook (optional)
    volumes:
      - .:/app
    working_dir: /app
    command: streamlit run app.py --server.address=0.0.0.0
    environment:
      - PYTHONUNBUFFERED=1
    stdin_open: true
    tty: true
